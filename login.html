<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Đăng nhập — KAISOUL HUB NEWS</title>
  <meta name="description" content="Đăng nhập KAISOUL HUB NEWS bằng tài khoản KAISOUL ID.">

  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

  <main class="login-container">

    <section class="login-card">

      <div class="login-brand">
        <strong>KAISOUL</strong>
        <span>HUB NEWS</span>
      </div>

      <div class="login-heading">
        <h1>Đăng nhập</h1>
        <p>Đăng nhập bằng tài khoản KAISOUL ID</p>
      </div>

      <form id="loginForm" novalidate>

        <div class="form-group">
          <label for="kaisoulId">KAISOUL ID</label>

          <input
            type="text"
            id="kaisoulId"
            name="kaisoulId"
            placeholder="Nhập KAISOUL ID"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>

          <div class="password-box">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Nhập mật khẩu"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              id="togglePassword"
              aria-label="Hiện hoặc ẩn mật khẩu"
            >
              Hiện
            </button>

          </div>
        </div>

        <div
          class="login-error"
          id="loginError"
          role="alert"
          aria-live="polite"
        ></div>

        <button
          type="submit"
          class="login-submit"
          id="loginSubmit"
        >
          Đăng nhập
        </button>

      </form>

      <div class="login-divider">
        <span>KAISOUL ID</span>
      </div>

      <div class="kaisoul-id-register">

        <p>Chưa có tài khoản KAISOUL ID?</p>

        <a
          href="https://phanvanthanh702-dev.github.io/KAISOUL-ID/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Đăng ký KAISOUL ID
        </a>

      </div>

      <div class="login-notice">
        <strong>Lưu ý</strong>

        <p>
          KAISOUL HUB NEWS không tạo tài khoản riêng.
          Bạn phải có tài khoản KAISOUL ID để đăng nhập.
        </p>
      </div>

    </section>

    <a href="index.html" class="back-home">
      ← Quay lại KAISOUL HUB NEWS
    </a>

  </main>

  <script src="app.js"></script>

</body>
</html>
